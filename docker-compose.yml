services:
  kiwi-server:
    build: .
    container_name: kiwi-server
    ports:
      - "6002:6002"
    environment:
      - KIWI_DATA=/data
      - KIWI_WEB_DIST=/app/web/dist
      - KIWI_AUTH=off
      - SEARXNG_URL=http://searxng:8080
    volumes:
      - ${HOME}/.local/share/kiwi:/data
    restart: unless-stopped
    depends_on:
      - searxng

  searxng:
    image: searxng/searxng:latest
    container_name: kiwi-searxng
    # UI/포트 노출 없음 — kiwi-server가 compose 네트워크 안에서
    # http://searxng:8080/search?format=json 으로만 사용
    #
    # server.secret_key는 설정 파일에 저장하지 않는다. 컨테이너가 시작될
    # 때마다 새로 생성해 SEARXNG_SECRET으로 주입한다 (SearXNG가 env로
    # settings.yml의 secret_key를 덮어쓴다).
    entrypoint:
      - /bin/sh
      - -c
      - |
        export SEARXNG_SECRET="$$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        exec /usr/local/searxng/entrypoint.sh
    volumes:
      - ./searxng:/etc/searxng:ro
    restart: unless-stopped
