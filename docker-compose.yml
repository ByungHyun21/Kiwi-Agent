services:
  kiwi-server:
    build: .
    container_name: kiwi-server
    ports:
      - "6002:6002"
    environment:
      - KIWI_DATA=/data
      - KIWI_WEB_DIST=/app/web/dist
      - KIWI_AUTH=off
      - SEARXNG_URL=http://searxng:8080
    volumes:
      - ${HOME}/.local/share/kiwi:/data
    restart: unless-stopped
    depends_on:
      - searxng

  searxng:
    image: searxng/searxng:latest
    container_name: kiwi-searxng
    # UI/포트 노출 없음 — kiwi-server가 compose 네트워크 안에서
    # http://searxng:8080/search?format=json 으로만 사용
    volumes:
      - ./searxng:/etc/searxng:ro
    restart: unless-stopped
